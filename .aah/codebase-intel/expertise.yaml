    tool: "Express 5 + Mongoose + React 19 + Vite"
    pattern: "Full-stack MERN app: Express REST API (CommonJS) on port 3000, React/TypeScript SPA via Vite on port 5173"
    injection: "Backend: require() in server.js; Frontend: ES module imports in main.tsx"
  jwt_auth:
    tool: "jsonwebtoken + bcrypt"
    pattern: "JWT signed with JWT_SECRET (24h expiry); token attached to req.user by verifyToken middleware; password bcrypt-hashed via Mongoose pre-save hook"
    injection: "verifyToken middleware applied per-route in routes/recipes.js; createJWT helper in controllers/users.js"
  mongoose_embedded_docs:
    tool: "Mongoose embedded sub-documents"
    pattern: "Ingredients and instructions are embedded arrays within Recipe — not separate collections. Access sub-docs via .id() method for nested CRUD."
    injection: "ingredientSchema and instructionSchema defined inline in models/recipe.js"
  gemini_sse_proxy:
    tool: "Google Gemini API + axios responseType:stream"
    pattern: "Backend proxies SSE stream from Gemini to client — upstream.data.pipe(res). API key stays on server; client only talks to /api/ai/stream."
    injection: "Planned in routes/ai.js; registered as app.use('/api/ai', require('./routes/ai')) in server.js"
  vite_env:
    tool: "Vite env vars"
    pattern: "Frontend env vars use VITE_ prefix and import.meta.env. VITE_BACKEND_URL defaults to http://localhost:3000."
    injection: "client/.env file; referenced via import.meta.env.VITE_BACKEND_URL in frontend code"

integrations:
