consumption_views:
  quick_context: |
    Spoonful is a bootcamp capstone MERN app: a recipe management platform where authenticated creators do CRUD on recipes (with embedded ingredients and instructions), and any visitor can browse/search publicly. The backend is a fully-implemented Express 5 REST API (CommonJS) on port 3000 with MongoDB via Mongoose and JWT auth. The React 19 + TypeScript frontend (Vite, port 5173) is a skeleton — only App.tsx exists; all pages are yet to be built. An AI Assistant feature (Google Gemini streaming SSE, proxied through the backend) is specified in DESIGN.md but not yet implemented. Both services run in Docker containers with separate Dockerfiles.
  style_guide: |
    ## Auth
    - Set JWT_SECRET and MONGO_URL in backend/.env before running — missing JWT_SECRET makes tokens trivially forgeable.
    - Never expose GEMINI_API_KEY to the client; all AI calls go through POST /api/ai/stream on the backend.
    - Use Authorization: Bearer <token> header for protected routes; verifyToken middleware decodes to req.user.

    ## API Patterns
    - Public routes (GET /api/recipes, GET /api/recipes/:id, POST /api/users/*) need NO middleware.
    - Protected routes must apply verifyToken before the controller in the route array.
    - Ownership check: always compare recipe.ownerId.toString() !== req.user._id (ObjectId vs string).

    ## Data Layer
    - Recipes embed ingredients and instructions as Mongoose sub-documents — use .id() to find by sub-doc _id.
    - ownerId on Recipe is set from req.user._id in the create controller — never accept it from req.body.
    - Mongoose toJSON transform strips password from User — do not manually delete it in controllers.

    ## Frontend
    - Use VITE_ prefix for all client env vars; access via import.meta.env.VITE_*.
    - Default VITE_BACKEND_URL to http://localhost:3000 for local dev.
    - Use axios for all API calls; include Authorization header from stored JWT token.
    - Add react-router-dom for SPA routing before building any pages.

    ## Testing
    - Capstone requires at least 4 React component tests — plan these from the start.
  known_concerns: |
    ## Instruction routes are missing
    - WHEN: You call addInstruction/updateInstruction/deleteInstruction via the API.
    - WHAT: 404 — no routes exist for these controller functions in routes/recipes.js.
    - HOW: Add routes like POST /api/recipes/:id/instructions and PATCH /api/recipes/:id/instructions/:instructionId before expecting these to work.

    ## JWT_SECRET not set
    - WHEN: JWT_SECRET env var is absent from backend/.env.
    - WHAT: Tokens sign and verify with undefined — any token with the right structure passes.
    - HOW: Always set JWT_SECRET to a strong random string in backend/.env before running the server.

    ## ObjectId string comparison
    - WHEN: Checking recipe ownership with ownerId !== req.user._id.
    - WHAT: Always returns true (never equal) because ownerId is an ObjectId and req.user._id is a string from the JWT.
    - HOW: Always use ownerId.toString() !== req.user._id for the comparison.

    ## Express 5 async errors
    - WHEN: An async controller throws an uncaught error in Express 5.
    - WHAT: Express 5 propagates async rejections automatically — no need for try/catch wrapper or next(err) in most cases, but explicit try/catch still clarifies intent.
    - HOW: Wrap controller bodies in try/catch and return error responses explicitly to avoid relying on Express 5 default error handling.

    ## SSE stream error on Gemini failure
    - WHEN: The Gemini API returns an HTTP error (e.g., 429, 400) with responseType:'stream'.
    - WHAT: err.response.data is a stream, not parsed JSON — reading it directly gives '[object Object]'.
    - HOW: Manually read the stream chunks to string before logging/returning the error body (see pattern in README.md AI route snippet).
